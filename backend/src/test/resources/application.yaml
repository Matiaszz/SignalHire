spring:
  application:
    name: backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false
  ai:
    google:
      genai:
        api-key: test-dummy-api-key

management:
  health:
    rabbit:
      enabled: false
