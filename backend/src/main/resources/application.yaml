server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: backend

  # Multipart Upload Configuration (Profiles & Avatars)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  # MongoDB Configuration
  data:
    mongodb:
      auto-index-creation: true


  # Spring AI (Google GenAI)
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY:}
        chat:
          options:
            model: ${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:gemini-2.5-flash}

  # Spring Boot Docker Compose integration (disabled by default to prevent conflicts with standalone docker compose)
  docker:
    compose:
      enabled: false
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI}
    database: ${SPRING_DATA_MONGODB_DATABASE:}

# Spring Boot Actuator & Health Checks Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true
    rabbit:
      enabled: true

app:
  storage:
    provider: s3
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      cookie-name: ${JWT_COOKIE_NAME:signalhire_refresh_token}
      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    public-endpoint: ${AWS_S3_PUBLIC_ENDPOINT:${AWS_S3_ENDPOINT:http://localhost:4566}}
    bucket: ${AWS_S3_BUCKET:signalhire-files}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}

