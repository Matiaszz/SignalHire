services:
  postgres:
    image: postgres:17-alpine
    container_name: signalhire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalhire}
      POSTGRES_USER: ${POSTGRES_USER:-signalhire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalhire_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signalhire} -d ${POSTGRES_DB:-signalhire}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - signalhire-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: signalhire-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-signalhire}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-signalhire_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - signalhire-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalhire-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-signalhire}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-signalhire}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-signalhire_secret}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-signalhire}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-signalhire_secret}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${SPRING_AI_GOOGLE_GENAI_API_KEY:-}
      SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - signalhire-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  signalhire-network:
    driver: bridge
